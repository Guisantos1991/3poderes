<header class="navbar">
  <div class="container navbar-container">
    <!-- Logotipo -->
    <a href="#" class="navbar-brand" (click)="closeMenu()">
      <img [src]="company.mainLogo" alt="3 Poderes Centro Automotivo" width="160" height="84" class="brand-logo" />
    </a>

    <!-- Menu Desktop -->
    <nav class="navbar-nav desktop-nav">
      <a href="#inicio" class="nav-link">Início</a>
      <a href="#diferenciais" class="nav-link">Diferenciais</a>
      <a href="#sobre" class="nav-link">O que Fazemos</a>
      <a href="#servicos" class="nav-link">Serviços</a>
      <a href="#avaliacoes" class="nav-link">Avaliações</a>
      <a href="#unidades" class="nav-link">Unidades</a>
    </nav>

    <!-- Ação Direta Desktop -->
    <div class="navbar-actions desktop-action">
      <a [href]="company.branches[0].whatsappUrl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary nav-cta">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>Agendar Horário</span>
      </a>
    </div>

    <!-- Botão Menu Mobile -->
    <button class="menu-toggle mobile-toggle" (click)="toggleMenu()" aria-label="Abrir menu de navegação">
      @if (!isMenuOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      }
    </button>
  </div>

  <!-- Menu Dropdown Mobile -->
  @if (isMenuOpen()) {
    <div class="mobile-drawer">
      <nav class="mobile-nav">
        <a href="#inicio" class="mobile-nav-link" (click)="closeMenu()">Início</a>
        <a href="#diferenciais" class="mobile-nav-link" (click)="closeMenu()">Diferenciais</a>
        <a href="#sobre" class="mobile-nav-link" (click)="closeMenu()">O que Fazemos</a>
        <a href="#servicos" class="mobile-nav-link" (click)="closeMenu()">Serviços</a>
        <a href="#avaliacoes" class="mobile-nav-link" (click)="closeMenu()">Avaliações</a>
        <a href="#unidades" class="mobile-nav-link" (click)="closeMenu()">Unidades & Contato</a>
        <div class="mobile-cta-wrapper">
          <a [href]="company.branches[0].whatsappUrl" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp btn-full" (click)="closeMenu()">
            Agendar na Unidade Canaã
          </a>
          <a [href]="company.branches[1].whatsappUrl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-full" (click)="closeMenu()">
            Agendar na Unidade Tubalina
          </a>
        </div>
      </nav>
    </div>
  }
</header>
