<div class="fab-wrapper">
  <!-- Popover de Escolha de Unidade -->
  @if (isPopoverOpen()) {
    <div class="fab-backdrop" (click)="closePopover()"></div>
    <div class="fab-popover">
      <div class="popover-header">
        <div class="popover-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.634.072-1.847-.43-1.442-.596-2.355-2.067-2.427-2.164-.07-.098-.578-.77-.578-1.469 0-.699.366-1.042.496-1.185.13-.144.283-.179.378-.179.096 0 .192.002.276.006.09.004.21-.035.328.25.12.288.414 1.01.45 1.082.036.072.06.156.012.252-.048.096-.072.156-.144.24-.072.084-.15.187-.215.251-.072.072-.148.15-.064.294.084.144.372.613.798.992.548.488 1.01.639 1.154.71.144.072.228.06.312-.036.084-.096.36-419.456-.563.096-.144.192-.12.324-.072.132.048.837.395.98.467.144.072.24.108.276.168.036.06.036.348-.108.753z"/>
          </svg>
          <span>ATENDIMENTO WHATSAPP</span>
        </div>
        <button class="popover-close" (click)="closePopover()" aria-label="Fechar">✕</button>
      </div>

      <p class="popover-subtitle">Selecione a unidade para agendar:</p>

      <div class="popover-branches">
        <!-- Unidade 1 Canaã: Em branco no normal -> Amarelo no Hover -->
        <a
          [href]="company.branches[0].whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="branch-card branch-canaa"
          (click)="closePopover()"
        >
          <div class="branch-content">
            <span class="branch-badge">UNIDADE 1</span>
            <strong class="branch-title">AGENDAR CANAÃ</strong>
            <span class="branch-phone">{{ company.branches[0].phoneDisplay }}</span>
          </div>
          <span class="branch-arrow">➔</span>
        </a>

        <!-- Unidade 2 Tubalina: Em branco no normal -> Vermelho no Hover -->
        <a
          [href]="company.branches[1].whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="branch-card branch-tubalina"
          (click)="closePopover()"
        >
          <div class="branch-content">
            <span class="branch-badge">UNIDADE 2</span>
            <strong class="branch-title">AGENDAR CHÁCARAS TUBALINA</strong>
            <span class="branch-phone">{{ company.branches[1].phoneDisplay }}</span>
          </div>
          <span class="branch-arrow">➔</span>
        </a>
      </div>
    </div>
  }

  <!-- Botão Flutuante Vibrante com Efeito Pulse -->
  <button
    class="fab-button"
    (click)="togglePopover()"
    aria-label="Falar no WhatsApp"
  >
    <span class="fab-pulse"></span>
    <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="white">
      <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.634.072-1.847-.43-1.442-.596-2.355-2.067-2.427-2.164-.07-.098-.578-.77-.578-1.469 0-.699.366-1.042.496-1.185.13-.144.283-.179.378-.179.096 0 .192.002.276.006.09.004.21-.035.328.25.12.288.414 1.01.45 1.082.036.072.06.156.012.252-.048.096-.072.156-.144.24-.072.084-.15.187-.215.251-.072.072-.148.15-.064.294.084.144.372.613.798.992.548.488 1.01.639 1.154.71.144.072.228.06.312-.036.084-.096.36-419.456-.563.096-.144.192-.12.324-.072.132.048.837.395.98.467.144.072.24.108.276.168.036.06.036.348-.108.753z"/>
    </svg>
  </button>
</div>
