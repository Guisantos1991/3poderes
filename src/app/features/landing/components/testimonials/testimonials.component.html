<section id="avaliacoes" class="testimonials-section section-wrapper">
  <div class="container">
    <app-section-header
      badge="Depoimentos"
      title="Veja o que nossos clientes dizem sobre nós"
      subtitle="A satisfação e a confiança de quem já conhece a qualidade e honestidade da 3 Poderes."
    ></app-section-header>

    <div class="testimonials-grid">
      @for (item of testimonials; track item.id) {
        <div class="testimonial-card">
          <!-- Estrelas de Avaliação -->
          <div class="rating-stars" aria-label="Avaliação 5 de 5 estrelas">
            @for (star of [1,2,3,4,5]; track star) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#FFC107" stroke="#FFC107" stroke-width="1">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            }
          </div>

          <!-- Comentário -->
          <blockquote class="testimonial-comment">
            "{{ item.comment }}"
          </blockquote>

          <!-- Autor & Detalhes -->
          <div class="testimonial-author">
            <div class="author-avatar">
              <span>{{ item.avatarText }}</span>
            </div>
            <div class="author-details">
              <strong class="author-name">{{ item.author }}</strong>
              <div class="author-meta">
                <span class="unit-tag">{{ item.unit }}</span>
                <span class="meta-dot">•</span>
                <span class="verified-badge">✓ Google Verificado</span>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
