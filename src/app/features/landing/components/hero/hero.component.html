      <!-- Título Principal -->
      <h1 class="hero-title">
        Sua oficina mecânica de confiança em Uberlândia
      </h1>

      <!-- Subtítulo em Caixa de Destaque -->
      <div class="hero-subtitle-box">
        <p class="hero-subtitle-text">
          Na 3 Poderes, seu carro é tratado com seriedade, transparência e qualidade real. 
          Sem empurrar serviço, sem enrolação!
        </p>
        <div class="hero-locations-tag">
          📍 Duas unidades: <strong>Canaã</strong> e <strong>Chácaras Tubalina</strong>.
        </div>
      </div>

      <img
        [src]="company.mainLogo"
